services:
  velvet-bot:
    build: .
    container_name: velvet-bot
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
      # Writable, botuser-owned volume holding bot.db plus its WAL/-shm sidecar
      # files. DB_FILE=/app/data/bot.db (set in the Dockerfile) points the app here.
      - bot-data:/app/data

volumes:
  bot-data:
    driver: local
