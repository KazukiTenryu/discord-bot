services:
  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    # Playlist web player. Bound to localhost only — nginx will reverse-proxy / TLS-terminate it.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      # Writable, botuser-owned volume holding bot.db plus its WAL/-shm sidecar files.
      # DB_FILE=/app/data/bot.db (set in the Dockerfile) points the app here so data
      # survives container rebuilds — a single-file bind mount loses the WAL sidecars.
      - bot-data:/app/data

volumes:
  bot-data:
    driver: local
