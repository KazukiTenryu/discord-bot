plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '8.3.0'
    id 'nu.studer.jooq' version '9.0'
    id 'com.gradleup.shadow' version "9.4.1"
}

application {
    mainClass = 'bot.Main'
}

shadowJar {
    archiveBaseName.set('app')
    archiveClassifier.set('')
    archiveVersion.set('')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            "-Alog4j.graalvm.groupId=bot",
            "-Alog4j.graalvm.artifactId=discord-bot"
    ]
}

spotless {
    java {
        palantirJavaFormat()
        importOrder('java', 'javax', 'net', 'org', 'com', '')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        targetExclude 'build/generated-src/**/*.java'
    }
}

repositories {
    mavenCentral()
    // Hosts LavaPlayer (dev.arbjerg) and the standalone YouTube source (dev.lavalink.youtube).
    maven { url 'https://maven.lavalink.dev/releases' }
}

dependencies {
    implementation 'net.dv8tion:JDA:6.3.2'

    // Voice playback: JDA only manages the voice-gateway connection; LavaPlayer sources and
    // decodes audio to Opus frames. LavaPlayer 2.x dropped the built-in YouTube manager, so the
    // standalone youtube-source (dev.lavalink.youtube:v2) provides it.
    implementation 'dev.arbjerg:lavaplayer:2.2.6'
    implementation 'dev.lavalink.youtube:v2:1.18.1'

    // Discord enforces the DAVE voice protocol (deadline 2026-03-01); JDA only ships a passthrough
    // stub, so without a real libdave implementation voice connections are rejected and the bot
    // joins/leaves in a loop. Both native variants are bundled: glibc for local/WSL2 runs and
    // musl for the Alpine Docker image.
    implementation 'moe.kyokobot.libdave:adapter-jda:0.1.2'
    implementation 'moe.kyokobot.libdave:impl-jni:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-win-x86-64:0.1.2' // local dev (Windows)
    runtimeOnly 'moe.kyokobot.libdave:natives-linux-x86-64:0.1.2' // generic Linux / WSL2
    runtimeOnly 'moe.kyokobot.libdave:natives-linux-musl-x86-64:0.1.2' // Alpine Docker image

    implementation 'org.apache.logging.log4j:log4j-api:2.25.3'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.3'
    annotationProcessor 'org.apache.logging.log4j:log4j-core:2.25.3'
    // Route JDA's SLF4J logging into log4j2 instead of silencing it with slf4j-nop. Without this,
    // JDA's voice-connection errors (e.g. the close code behind a join/leave loop) are invisible.
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.3'

    implementation 'tools.jackson.core:jackson-core:3.1.0'
    implementation 'tools.jackson.core:jackson-databind:3.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.21'

    implementation 'org.flywaydb:flyway-core:12.2.0'
    implementation 'org.jooq:jooq:3.21.1'
    implementation 'org.jooq:jooq-codegen:3.21.1'
    implementation 'org.jooq:jooq-meta:3.21.1'
    implementation 'com.zaxxer:HikariCP:7.0.2'
    implementation 'org.xerial:sqlite-jdbc:3.51.3.0'
    jooqGenerator 'org.xerial:sqlite-jdbc:3.51.3.0'
    
    // GIF encoding library
    implementation 'com.madgag:animated-gif-lib:1.4'
}

jooq {
    version = '3.19.8'

    configurations {
        main {
            generationTool {
                jdbc {
                    driver = 'org.sqlite.JDBC'
                    url = 'jdbc:sqlite:bot.db'
                }
                generator {
                    database {
                        name = 'org.jooq.meta.sqlite.SQLiteDatabase'
                    }
                    target {
                        packageName = 'bot.database.jooq'
                        directory = 'build/generated-src/jooq/main'
                    }
                }
            }
        }
    }
}

sourceSets.main.java.srcDirs += 'build/generated-src/jooq/main'

// Isolated source set for the Flyway runner. It only sees Flyway + the JDBC driver (via the
// inherited 'implementation' dependencies); the app's compiled/generated classes are NOT on its
// classpath, so it builds independently of jOOQ code generation.
sourceSets {
    migration {
        java.srcDir 'src/migration/java'
    }
}

// The runner only needs Flyway, the JDBC driver, and Flyway's Jackson dependency — not the app's
// full dependency tree. Keep this classpath minimal and independent of 'implementation'.
dependencies {
    migrationImplementation 'org.flywaydb:flyway-core:12.2.0'
    migrationImplementation 'org.xerial:sqlite-jdbc:3.51.3.0'
    migrationImplementation 'tools.jackson.core:jackson-databind:3.1.0'
    migrationRuntimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}

// Applies all migrations to bot.db so jOOQ can generate from a real, up-to-date schema. Works on a
// fresh checkout too: SQLite creates the file and Flyway applies V1..Vn from scratch.
tasks.register('migrateDb', JavaExec) {
    group = 'database'
    description = 'Apply Flyway migrations to bot.db before code generation'
    dependsOn tasks.named('compileMigrationJava')
    classpath = sourceSets.migration.runtimeClasspath
    mainClass = 'MigrateDb'
    args = ['bot.db', 'src/main/resources/db']
}

// Full chain on any build: compileJava -> generateJooq -> migrateDb. This guarantees the schema is
// migrated and the jOOQ classes are generated before compilation, so a clean checkout builds in one
// step with no manual bootstrap.
tasks.named('generateJooq').configure {
    dependsOn tasks.named('migrateDb')
}
tasks.named('compileJava').configure {
    dependsOn tasks.named('generateJooq')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:-deprecation"]
}